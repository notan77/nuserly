<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Nota de Enfermería</title>
</head>
<body>

<h2>Nueva nota de enfermería</h2>

<p>
    <strong>Paciente:</strong>
    {{ paciente.nombres }} {{ paciente.apellidos }}

<form method="post">

</form>

</body>
</html>
