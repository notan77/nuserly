<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nota de Enfermería</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
        }
        .campo {
            margin-bottom: 15px;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body onload="window.print()">

    <h1>Nota de Enfermería</h1>

    <div class="campo">
        <span class="label">Paciente:</span>
        {{ nota.paciente }}
    </div>

    <div class="campo">
        <span class="label">Fecha:</span>
        {{ nota.fecha }}
    </div>

    <div class="campo">
        <span class="label">Contenido:</span>
        <p>{{ nota.contenido }}</p>
    </div>

</body>
</html>
